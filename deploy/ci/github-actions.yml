# Draft CI: copy to .github/workflows/ci.yml when the repo is on GitHub.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements/base.txt -r requirements/dev.txt
      - run: python -m pytest tests -q
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t preveda/madhu-dr:${{ github.sha }} .
