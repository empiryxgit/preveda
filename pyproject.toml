[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preveda-dr"
dynamic = ["version", "dependencies"]
description = "PreVeda Madhu-DR: diabetic-retinopathy screening node (ONNX, CPU, offline-first)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Empiryx" }]
classifiers = ["License :: Other/Proprietary License"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "onnx>=1.16", "onnxscript", "scikit-learn>=1.4", "pandas>=2.1", "openpyxl>=3.1", "tabulate>=0.9"]
dev = ["pytest>=8", "httpx>=0.27", "pandas>=2.1"]

[tool.setuptools.dynamic]
version = {attr = "preveda_dr.__version__"}
dependencies = {file = ["requirements/base.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
